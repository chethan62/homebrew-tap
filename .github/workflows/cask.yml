name: cask

# Proves the cask in this repo actually installs: a macOS runner taps this
# checkout, installs the cask, and runs the installed app's `--version`. A cask
# that lints but 404s or hashes wrong is exactly what this catches.
#
# TODO: this job is torrentx-specific — tap name, cask name, app path and the
# `TorrentX <version>` output format are hardcoded below. A second cask needs a
# per-cask mapping (or one matrix entry each) before this covers it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: brew install --cask torrentx
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tap this checkout and install
        run: |
          brew tap chethan62/tap "$GITHUB_WORKSPACE"
          # Homebrew refuses casks from a third-party tap until it is trusted;
          # interactively it prompts, on a runner it just fails.
          brew trust --cask chethan62/tap/torrentx
          brew install --cask torrentx

      - name: The installed app runs
        run: |
          app="/Applications/TorrentX.app/Contents/MacOS/torrentx"
          if [ ! -x "$app" ]; then
            app="$HOME/Applications/TorrentX.app/Contents/MacOS/torrentx"
          fi
          [ -x "$app" ] || { echo "::error::TorrentX.app not found in /Applications or ~/Applications"; exit 1; }
          out=$("$app" --version)
          echo "version output: $out"
          # Compare against what the cask claims, not a pattern: the pin is the
          # thing that can be wrong, so `18.*` would pass a stale 18.8.0 cask.
          want=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/torrentx.rb)
          [ "$out" = "TorrentX $want" ] || { echo "::error::cask pins $want but the app reports '$out'"; exit 1; }

      - name: Uninstall
        run: brew uninstall --cask torrentx
