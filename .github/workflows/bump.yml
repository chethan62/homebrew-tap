name: bump

# Keeps the cask on the latest TorrentX release without anyone remembering to.
#
# Fast path: torrentx's release workflow posts a `release` repository_dispatch
# here as soon as the .dmg is published. Backstop: the hourly schedule, which
# also catches a release whose dispatch never arrived, and needs no credentials.
#
# The bump itself runs on ubuntu; the macOS install check is dispatched
# separately because a macOS job that `needs:` another job was cancelled on
# arrival twice, while the same job as a workflow of its own runs fine.
on:
  repository_dispatch:
    types: [release]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/bump-cask.sh"]

permissions:
  contents: write
  actions: write # to dispatch the install check below

jobs:
  bump:
    name: bump to the latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update version + sha256
        run: ./scripts/bump-cask.sh

      # A push made with GITHUB_TOKEN does not start other workflows (that is
      # GitHub's recursion guard), so the install check is dispatched explicitly.
      # `workflow_dispatch` is the documented exception to that rule — and
      # a macOS job that only exists after a bump is cheaper than one hourly.
      - name: Commit, then ask for the install check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Casks/torrentx.rb; then
            echo "cask already current, nothing to verify"
            exit 0
          fi
          ver=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/torrentx.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/torrentx.rb
          git commit -m "cask: bump to $ver"
          git push
          gh workflow run cask.yml
          echo "dispatched the install check for $ver"
